<!doctype html>
<!-- Fuente de site/og-image.jpg (1200 × 630). Usa el mismo laminar.js del hero.
     Para regenerarla, ver «Imagen para compartir» en el README. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Geist; src: url("../site/fonts/geist-latin-variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Martian Mono"; src: url("../site/fonts/martian-mono-latin-variable.woff2") format("woff2"); font-weight: 100 800; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #000; }
  .hero { position: relative; isolation: isolate; width: 1200px; height: 630px; background: #000; color: #f2f2f2; font-family: Geist, sans-serif; -webkit-font-smoothing: antialiased; }
  .laminar-field { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
  .brand { position: absolute; top: 60px; left: 72px; z-index: 2; margin: 0; font-size: 26px; font-weight: 500; letter-spacing: -.02em; }
  .brand span { color: #f5824b; }
  .hero-copy { position: absolute; left: 72px; bottom: 64px; z-index: 2; width: 720px; }
  h1 { margin: 0 0 26px; font-size: 64px; font-weight: 350; line-height: 1.1; letter-spacing: -.032em; text-wrap: balance; }
  .meta { margin: 0; color: #bdbdbd; font: 500 14px/1 "Martian Mono", monospace; letter-spacing: .06em; text-transform: uppercase; }
</style>
</head>
<body>
  <section class="hero">
    <canvas class="laminar-field" aria-hidden="true"></canvas>
    <p class="brand">Marcos Freixanet<span>.</span></p>
    <div class="hero-copy">
      <h1>I turn complex ideas into clear, shipped products.</h1>
      <p class="meta">iPhone apps · Web · AI agents · Barcelona</p>
    </div>
  </section>
  <script type="module" src="../site/laminar.js"></script>
</body>
</html>
